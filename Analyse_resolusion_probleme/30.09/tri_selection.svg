<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc">
<title id="title">Tri par sélection : les échanges pas à pas</title>
<desc id="desc">Tableau initial 8, 2, 7, 9, 5, 3, 4. Chaque ligne montre la recherche d'un minimum dans la zone restante. Les échanges placent successivement 2, 3, 4, 5, 7 et 8. Le résultat est 2, 3, 4, 5, 7, 8, 9.</desc>
