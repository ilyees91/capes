<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="930" viewBox="0 0 1140 930" role="img" aria-labelledby="titre description">
<title id="titre">Tri par insertion : insérer dans le préfixe trié</title>
<desc id="description">À gauche, les insertions trient le tableau 4, 2, 3, 5, 1. À droite, la dernière insertion conserve val égale à 1 et décale successivement 5, 4, 3 et 2 vers la droite, avant de placer 1 au début. Le trou dessiné est une position logique, pas une suppression de case.</desc>
<defs><marker id="fleche" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
<rect width="1140" height="930" rx="18" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif" fill="#172033">
<text x="35" y="45" font-size="29" font-weight="700">Tri par insertion : décaler, puis insérer</text>
<text x="35" y="77" font-size="17" fill="#475569">Exemple de la photo : [4, 2, 3, 5, 1]</text>
<rect x="35" y="98" width="19" height="19" rx="4" fill="#dcfce7" stroke="#16a34a"/>
<text x="64" y="113" font-size="16">Préfixe trié, encore déplaçable</text>
<rect x="367" y="98" width="19" height="19" rx="4" fill="#ffedd5" stroke="#ea580c"/>
<text x="398" y="113" font-size="16">Prochaine valeur à insérer</text>
<rect x="721" y="98" width="19" height="19" rx="4" fill="white" stroke="#2563eb" stroke-dasharray="4 3"/>
<text x="752" y="113" font-size="16">« Trou » logique</text>
<line x1="565" y1="135" x2="565" y2="820" stroke="#cbd5e1"/>
<text x="35" y="157" font-size="21" font-weight="700">1. Les insertions successives</text>
<text x="600" y="157" font-size="21" font-weight="700">2. Zoom : insérer 1 (i = 4)</text>
<text x="600" y="185" font-size="16" fill="#2563eb">Valeur sauvegardée : val = 1</text><g id="vue-0"><text x="35" y="244" font-size="17" font-weight="600">Départ</text><rect x="180" y="215" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="208" y="250" text-anchor="middle" font-size="25">4</text><rect x="246" y="215" width="56" height="52" rx="7" fill="#ffedd5" stroke="#ea580c"/><text x="274" y="250" text-anchor="middle" font-size="25">2</text><rect x="312" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1"/><text x="340" y="250" text-anchor="middle" font-size="25">3</text><rect x="378" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1"/><text x="406" y="250" text-anchor="middle" font-size="25">5</text><rect x="444" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1"/><text x="472" y="250" text-anchor="middle" font-size="25">1</text><text x="180" y="295" font-size="15" fill="#475569">Insérer 2 devant 4.</text></g><g id="vue-1"><text x="35" y="364" font-size="17" font-weight="600">Après i = 1</text><rect x="180" y="335" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="208" y="370" text-anchor="middle" font-size="25">2</text><rect x="246" y="335" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="274" y="370" text-anchor="middle" font-size="25">4</text><rect x="312" y="335" width="56" height="52" rx="7" fill="#ffedd5" stroke="#ea580c"/><text x="340" y="370" text-anchor="middle" font-size="25">3</text><rect x="378" y="335" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1"/><text x="406" y="370" text-anchor="middle" font-size="25">5</text><rect x="444" y="335" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1"/><text x="472" y="370" text-anchor="middle" font-size="25">1</text><text x="180" y="415" font-size="15" fill="#475569">Insérer 3 entre 2 et 4.</text></g><g id="vue-2"><text x="35" y="484" font-size="17" font-weight="600">Après i = 2</text><rect x="180" y="455" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="208" y="490" text-anchor="middle" font-size="25">2</text><rect x="246" y="455" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="274" y="490" text-anchor="middle" font-size="25">3</text><rect x="312" y="455" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="340" y="490" text-anchor="middle" font-size="25">4</text><rect x="378" y="455" width="56" height="52" rx="7" fill="#ffedd5" stroke="#ea580c"/><text x="406" y="490" text-anchor="middle" font-size="25">5</text><rect x="444" y="455" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1"/><text x="472" y="490" text-anchor="middle" font-size="25">1</text><text x="180" y="535" font-size="15" fill="#475569">5 est déjà à sa place dans le préfixe.</text></g><g id="vue-3"><text x="35" y="604" font-size="17" font-weight="600">Après i = 3</text><rect x="180" y="575" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="208" y="610" text-anchor="middle" font-size="25">2</text><rect x="246" y="575" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="274" y="610" text-anchor="middle" font-size="25">3</text><rect x="312" y="575" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="340" y="610" text-anchor="middle" font-size="25">4</text><rect x="378" y="575" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="406" y="610" text-anchor="middle" font-size="25">5</text><rect x="444" y="575" width="56" height="52" rx="7" fill="#ffedd5" stroke="#ea580c"/><text x="472" y="610" text-anchor="middle" font-size="25">1</text><text x="180" y="655" font-size="15" fill="#475569">Insérer 1 devant tout le préfixe.</text></g><g id="vue-4"><text x="35" y="724" font-size="17" font-weight="600">Résultat</text><rect x="180" y="695" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="208" y="730" text-anchor="middle" font-size="25">1</text><rect x="246" y="695" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="274" y="730" text-anchor="middle" font-size="25">2</text><rect x="312" y="695" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="340" y="730" text-anchor="middle" font-size="25">3</text><rect x="378" y="695" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="406" y="730" text-anchor="middle" font-size="25">4</text><rect x="444" y="695" width="56" height="52" rx="7" fill="#dcfce7" stroke="#86cfa0"/><text x="472" y="730" text-anchor="middle" font-size="25">5</text><text x="180" y="775" font-size="15" fill="#475569">Les cinq valeurs sont triées.</text></g><g id="zoom-0"><text x="600" y="246" font-size="17">j = 4</text><rect x="735" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="763" y="250" text-anchor="middle" font-size="25">2</text><rect x="801" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="829" y="250" text-anchor="middle" font-size="25">3</text><rect x="867" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="895" y="250" text-anchor="middle" font-size="25">4</text><rect x="933" y="215" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="961" y="250" text-anchor="middle" font-size="25">5</text><rect x="999" y="215" width="56" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="1027" y="250" text-anchor="middle" font-size="25">·</text><path d="M 961 273 Q 994 309 1027 273" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#fleche)"/><text x="600" y="298" font-size="14" fill="#2563eb">Décaler 5 →</text></g><g id="zoom-1"><text x="600" y="346" font-size="17">j = 3</text><rect x="735" y="315" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="763" y="350" text-anchor="middle" font-size="25">2</text><rect x="801" y="315" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="829" y="350" text-anchor="middle" font-size="25">3</text><rect x="867" y="315" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="895" y="350" text-anchor="middle" font-size="25">4</text><rect x="933" y="315" width="56" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="961" y="350" text-anchor="middle" font-size="25">·</text><rect x="999" y="315" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="1027" y="350" text-anchor="middle" font-size="25">5</text><path d="M 895 373 Q 928 409 961 373" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#fleche)"/><text x="600" y="398" font-size="14" fill="#2563eb">Décaler 4 →</text></g><g id="zoom-2"><text x="600" y="446" font-size="17">j = 2</text><rect x="735" y="415" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="763" y="450" text-anchor="middle" font-size="25">2</text><rect x="801" y="415" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="829" y="450" text-anchor="middle" font-size="25">3</text><rect x="867" y="415" width="56" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="895" y="450" text-anchor="middle" font-size="25">·</text><rect x="933" y="415" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="961" y="450" text-anchor="middle" font-size="25">4</text><rect x="999" y="415" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="1027" y="450" text-anchor="middle" font-size="25">5</text><path d="M 829 473 Q 862 509 895 473" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#fleche)"/><text x="600" y="498" font-size="14" fill="#2563eb">Décaler 3 →</text></g><g id="zoom-3"><text x="600" y="546" font-size="17">j = 1</text><rect x="735" y="515" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="763" y="550" text-anchor="middle" font-size="25">2</text><rect x="801" y="515" width="56" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="829" y="550" text-anchor="middle" font-size="25">·</text><rect x="867" y="515" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="895" y="550" text-anchor="middle" font-size="25">3</text><rect x="933" y="515" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="961" y="550" text-anchor="middle" font-size="25">4</text><rect x="999" y="515" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="1027" y="550" text-anchor="middle" font-size="25">5</text><path d="M 763 573 Q 796 609 829 573" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#fleche)"/><text x="600" y="598" font-size="14" fill="#2563eb">Décaler 2 →</text></g><g id="zoom-4"><text x="600" y="646" font-size="17">j = 0</text><rect x="735" y="615" width="56" height="52" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/><text x="763" y="650" text-anchor="middle" font-size="25">·</text><rect x="801" y="615" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="829" y="650" text-anchor="middle" font-size="25">2</text><rect x="867" y="615" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="895" y="650" text-anchor="middle" font-size="25">3</text><rect x="933" y="615" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="961" y="650" text-anchor="middle" font-size="25">4</text><rect x="999" y="615" width="56" height="52" rx="7" fill="white" stroke="#cbd5e1" /><text x="1027" y="650" text-anchor="middle" font-size="25">5</text><text x="735" y="698" font-size="14" fill="#2563eb">j = 0 : arrêter les décalages</text></g><g id="zoom-5"><text x="600" y="746" font-size="17">Insérer val</text><rect x="735" y="715" width="56" height="52" rx="7" fill="#dcfce7" stroke="#cbd5e1" /><text x="763" y="750" text-anchor="middle" font-size="25">1</text><rect x="801" y="715" width="56" height="52" rx="7" fill="#dcfce7" stroke="#cbd5e1" /><text x="829" y="750" text-anchor="middle" font-size="25">2</text><rect x="867" y="715" width="56" height="52" rx="7" fill="#dcfce7" stroke="#cbd5e1" /><text x="895" y="750" text-anchor="middle" font-size="25">3</text><rect x="933" y="715" width="56" height="52" rx="7" fill="#dcfce7" stroke="#cbd5e1" /><text x="961" y="750" text-anchor="middle" font-size="25">4</text><rect x="999" y="715" width="56" height="52" rx="7" fill="#dcfce7" stroke="#cbd5e1" /><text x="1027" y="750" text-anchor="middle" font-size="25">5</text></g><text x="35" y="851" font-size="17" font-weight="600">On sauvegarde val avant d'écraser sa case, puis on remplit le trou à la fin.</text>
<text x="35" y="880" font-size="16" fill="#475569">Le trou est un repère : dans la vraie liste, les décalages créent temporairement des doublons.</text>
<text x="35" y="909" font-size="16" fill="#475569">Condition correcte : j &gt; 0 and tab[j - 1] &gt; val. Les dernières étapes complètent la photo.</text></g></svg>
