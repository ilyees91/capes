<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="850" viewBox="0 0 1000 850" role="img" aria-labelledby="title desc">
<title id="title">Tri à bulles : premier passage</title>
<desc id="desc">À partir de 8, 3, 5, 2, 7, 4, cinq échanges de voisins déplacent 8 vers la droite. Le premier passage donne 3, 5, 2, 7, 4, 8 ; le reste du tableau n'est pas encore trié.</desc>
